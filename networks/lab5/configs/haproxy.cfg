global
    log /dev/log local0
    log /dev/log local1 notice
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s
    user haproxy
    group haproxy
    daemon
    maxconn 50000

    ca-base /etc/ssl/certs
    crt-base /etc/ssl/cluster

    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    log global
    mode http
    option httplog
    option dontlognull
    timeout connect 5s
    timeout client 50s
    timeout server 50s
    timeout http-request 10s
    timeout queue 1m
    timeout check 10s
    maxconn 50000
    retries 3

# === STATS ===
listen stats
    bind *:8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats admin if TRUE

# === Frontend HTTPS (Flask) ===
frontend https_in
    bind *:443 ssl crt /etc/ssl/cluster/cluster-haproxy.pem alpn h2,http/1.1
    bind *:80
    mode http
    option forwardfor
    http-request redirect scheme https unless { ssl_fc }
    default_backend flask_backend

backend flask_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    server node1 192.168.64.11:5000 check
    server node2 192.168.64.12:5000 check
    server node3 192.168.64.13:5000 check

# === Frontend MySQL (ProxySQL / Galera) ===
frontend mysql_in
    bind *:3306
    mode tcp
    option tcplog
    default_backend mysql_backend

backend mysql_backend
    mode tcp
    balance leastconn
    option tcp-check
    server node1 192.168.64.11:6033 check
    server node2 192.168.64.12:6033 check
    server node3 192.168.64.13:6033 check

# === Frontend MinIO ===
frontend minio_api_in
    bind *:9000 ssl crt /etc/ssl/cluster/cluster-haproxy.pem
    mode http
    default_backend minio_api_backend

backend minio_api_backend
    mode http
    balance roundrobin
    option httpchk
    http-check send meth GET uri /minio/health/live ver HTTP/1.1 hdr Host minio
    server node1 192.168.64.11:9000 check ssl verify none
    server node2 192.168.64.12:9000 check ssl verify none
    server node3 192.168.64.13:9000 check ssl verify none

frontend minio_console_in
    bind *:9001 ssl crt /etc/ssl/cluster/cluster-haproxy.pem
    mode http
    default_backend minio_console_backend

backend minio_console_backend
    mode http
    balance roundrobin
    server node1 192.168.64.11:9001 check ssl verify none
    server node2 192.168.64.12:9001 check ssl verify none
    server node3 192.168.64.13:9001 check ssl verify none
