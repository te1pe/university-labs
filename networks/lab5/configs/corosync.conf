totem {
    version: 2
    cluster_name: highload-cluster
    transport: knet
    crypto_cipher: aes256
    crypto_hash: sha256

    interface {
        linknumber: 0
        knet_transport: udp
    }
}

nodelist {
    node {
        ring0_addr: 192.168.64.11
        name: node1
        nodeid: 1
    }
    node {
        ring0_addr: 192.168.64.12
        name: node2
        nodeid: 2
    }
    node {
        ring0_addr: 192.168.64.13
        name: node3
        nodeid: 3
    }
}

quorum {
    provider: corosync_votequorum
    expected_votes: 3
    wait_for_all: 1
    last_man_standing: 1
    auto_tie_breaker: 0
}

logging {
    to_logfile: yes
    logfile: /var/log/corosync/corosync.log
    to_syslog: yes
    timestamp: on
    debug: off
}
