-- Слушаем на порту 5353 (чтобы не конфликтовать с system DNS)
setLocal('0.0.0.0:5353')

-- Console для удалённого управления (только локальный доступ)
setKey("AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=")
controlSocket('127.0.0.1:5199')

-- Backend resolvers с healthcheck
newServer({
    address="1.1.1.1:53",
    name="cloudflare",
    checkName="cluster.local",
    checkType="A",
    checkInterval=10,
    maxCheckFailures=3,
    pool=""
})

newServer({
    address="8.8.8.8:53",
    name="google",
    checkName="cluster.local",
    checkType="A",
    checkInterval=10,
    maxCheckFailures=3,
    pool=""
})

-- Балансировка: round-robin
setServerPolicy(roundrobin)

-- Логирование запросов на disk (закомментировано для производительности)
-- addAction(AllRule(), LogAction("/var/log/dnsdist/queries.log"))

-- Лимит запросов на клиент (защита от DoS)
addAction(MaxQPSIPRule(100), DropAction())

-- ACL: разрешаем запросы только из кластерной подсети
setACL({"127.0.0.0/8", "192.168.64.0/24", "10.0.2.0/24"})

-- Webserver на 8083 для мониторинга
webserver("0.0.0.0:8083")
setWebserverConfig({password="webpassword", apiKey="apikey"})
